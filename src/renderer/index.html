<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NSMP Launcher</title>

<style>
:root {
    --bg: #0a0c12;
    --panel: rgba(18, 22, 34, 0.72);
    --panel-solid: #121626;
    --text: #e6e9f2;
    --muted: #8b92a8;
    --accent: #5c6fff;
    --accent2: #4653e5;
    --border: rgba(255,255,255,0.08);
}

* {
    box-sizing: border-box;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

body {
    margin: 0;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;

    background: radial-gradient(
        900px 500px at 20% 0%,
        #1a1f36,
        var(--bg)
    );

    background-repeat: no-repeat;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: rgba(10,12,18,0.6);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
}

.brand {
    font-weight: 600;
    letter-spacing: 0.5px;
    font-size: 22px;
    opacity: 0.9;
}

.nav {
    display: none;
}

.wrapper {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
}

.card {
    background: linear-gradient(180deg,
        rgba(20, 24, 40, 0.75),
        rgba(12, 14, 24, 0.85)
    );

    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px;

    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    backdrop-filter: blur(14px);

    position: relative;
    overflow: hidden;
}

.row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.25);
    color: var(--text);
    outline: none;
}

input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,92,255,0.15);
}

button {
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(124,92,255,0.35);
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    cursor: pointer;
    font-weight: 600;
}

progress {
    width: 100%;
    height: 10px;
    border-radius: 10px;
    overflow: hidden;
}

progress::-webkit-progress-bar {
    background: rgba(255,255,255,0.05);
}

progress::-webkit-progress-value {
    background: linear-gradient(90deg, var(--accent), #60a5fa);
}

.console {
    margin-top: 14px;
    height: 240px;
    overflow-y: auto;

    padding: 12px;
    border-radius: 14px;

    background: rgba(10, 12, 20, 0.35);
    border: 1px solid rgba(255,255,255,0.06);

    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: #cbd5e1;

    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
}

.line { margin-bottom: 4px; }
.info { color: #cbd5e1; }
.success { color: #22c55e; }
.warn { color: #f59e0b; }
.error { color: #ef4444; }

.small {
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
}
</style>
</head>

<body>

<div class="topbar">
    <div class="brand">NSMP</div>
</div>

<div class="wrapper">

    <div class="card">

        <div class="row">
            <input id="username" value="Player" placeholder="Username" />
            <button id="launch">Graj</button>
        </div>

        <div class="small">Za pierwszym razem, właczanie gry może zająć dużo dłużej, ale zależy to od prędkości internetu.</div>
        <progress id="progress" value="0" max="100"></progress>

        <div class="small">Debug Console</div>

        <div id="status" class="console">
            <div class="line info">Ready.</div>
        </div>

    </div>

</div>

<script type="module" src="./main.ts"></script>

</body>
</html>
